name: Publish Helm chart to GitHub Pages

on:
  workflow_run:
    workflows:
      - "Build, scan, and push image"
    types:
      - completed

permissions:
  pages: write
  id-token: write
  contents: read
  actions: read   # allow REST API reads for artifacts
  contents: read

jobs:
  package-and-publish:
    # Only run if the triggering workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download scan artifacts from triggering workflow run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifacts
          echo "Listing artifacts for run $RUN_ID"
          artifacts_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts")
          echo "$artifacts_json" | jq -r '.artifacts[]? | "\(.name) \(.id)"' | while read name id; do
            echo "Downloading artifact $name (id $id)"
            curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" -o /tmp/artifact.zip
            mkdir -p /tmp/artifacts/$name
            unzip -o /tmp/artifact.zip -d /tmp/artifacts/$name >/dev/null
          done

          # If trivy JSON exists, show a short summary in the publish job summary
          if [ -f /tmp/artifacts/trivy-report/trivy.json ]; then
            CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' /tmp/artifacts/trivy-report/trivy.json)
            HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' /tmp/artifacts/trivy-report/trivy.json)
            MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' /tmp/artifacts/trivy-report/trivy.json)
            echo "## Build scan summary (from build-and-scan)" >> $GITHUB_STEP_SUMMARY
            echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- Medium: $MEDIUM" >> $GITHUB_STEP_SUMMARY
          else
            echo "No trivy-report artifact found in triggering run; skipping scan summary."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: v3.12.0

      - name: Package Helm chart
        run: |
          mkdir -p site
          helm package ./chart/nginx-demo -d site
          helm repo index site --url https://flesrusselle.github.io/nginx-ci-demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: package-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

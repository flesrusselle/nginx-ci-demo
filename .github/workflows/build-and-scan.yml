name: Build, scan, and push image
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v2
        with:
          dockerfile: Dockerfile

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:latest

      - name: Generate SBOM (Syft)
        uses: anchore/syft-action@v0.15.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:${{ github.sha }}
          output: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Trivy scan pushed image
        uses: aquasecurity/trivy-action@v2
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:${{ github.sha }}
          format: 'table'

      - name: Grype scan pushed image
        uses: anchore/grype-action@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:${{ github.sha }}

  # Optional: add more jobs for additional scans if you like


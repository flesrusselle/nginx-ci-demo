name: Build, scan, and push image
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:latest

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:${{ github.sha }}
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Run Trivy scan and save JSON
        id: trivy
        run: |
          mkdir -p trivy-output
          # run Trivy in a container (no install required); use a pinned version
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasecurity/trivy:0.43.2 \
            image --format json --output /tmp/trivy.json ghcr.io/${{ github.repository_owner }}/nginx-ci-demo:${{ github.sha }} || true
          mv /tmp/trivy.json trivy-output/trivy.json || true
      
          # parse summary counts (safe even if file missing/empty)
          if [ -f trivy-output/trivy.json ]; then
            CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-output/trivy.json)
            HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-output/trivy.json)
            MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-output/trivy.json)
          else
            CRITICAL=0; HIGH=0; MEDIUM=0
          fi
      
          # write a human-friendly job summary (shows in the Actions UI -> Job -> Summary)
          echo "## Trivy scan summary for ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
          echo "- Medium: $MEDIUM" >> $GITHUB_STEP_SUMMARY
      
          # expose counts as step outputs (optional)
          echo "critical=${CRITICAL}" >> $GITHUB_OUTPUT
          echo "high=${HIGH}" >> $GITHUB_OUTPUT
          echo "medium=${MEDIUM}" >> $GITHUB_OUTPUT
      
      - name: Upload Trivy JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-output/trivy.json

  # Optional: add more jobs for additional scans if you like

